[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-vite"
version = "3.3.0"
description = "Native pywebview + React desktop app to manage local Odoo instances (creation wizard + lifecycle + DB/modules/config/logs/devtools)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psutil>=5.9",
    "keyring>=24.0",
    # Web cutover: window shell for the React frontend. The GTK backend
    # uses the system PyGObject (README apt line: python3-gi,
    # gir1.2-gtk-3.0, gir1.2-webkit2-4.1) — no pip GUI build needed.
    "pywebview>=6.2",
    # Dev Mode Watch (Sprint 11 ticket 11.2): inotify-backed file watching
    # per spec ("real filesystem-watching mechanism, not polling").
    "watchdog>=4.0",
]
authors = [{ name = "Odoo Vite Team" }]

[project.optional-dependencies]
test = ["pytest>=8.0"]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.setuptools.packages.find]
include = ["odoo_vite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Maintenance-ticket scope: pyflakes (unused imports/names, undefined
# names) + syntax errors only. The bug class linters catch instantly;
# style rules stay out until someone wants that fight.
target-version = "py312"
select = ["F", "E9"]
