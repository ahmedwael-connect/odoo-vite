[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-vite"
version = "1.0.0"
description = "Native GTK4 Ubuntu desktop app to manage local Odoo instances (Phase 1: creation wizard + lifecycle)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyGObject>=3.48",
    "psutil>=5.9",
    "keyring>=24.0",
]
authors = [{ name = "Odoo Vite Team" }]

[project.optional-dependencies]
test = ["pytest>=8.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["odoo_vite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
