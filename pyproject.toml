[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-vite"
version = "1.0.1"
description = "Native GTK4 Ubuntu desktop app to manage local Odoo instances (Phase 1: creation wizard + lifecycle)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psutil>=5.9",
    "keyring>=24.0",
    # PSQ-1.1: pinned exact — Qt has meaningful behavior differences
    # across minor versions; verified 6.9.1 on Ubuntu 24.04 / Python 3.12
    # (both xcb under Xvfb and offscreen platform plugin work; xcb needs
    # a user-space libxcb-cursor0, see docs/qt-architecture.md).
    "PySide6==6.9.1",
]
authors = [{ name = "Odoo Vite Team" }]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-qt>=4.0"]
dev = ["pytest>=8.0", "pytest-qt>=4.0", "ruff>=0.8"]

[tool.setuptools.packages.find]
include = ["odoo_vite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Maintenance-ticket scope: pyflakes (unused imports/names, undefined
# names) + syntax errors only. The bug class linters catch instantly;
# style rules stay out until someone wants that fight.
target-version = "py311"
select = ["F", "E9"]
