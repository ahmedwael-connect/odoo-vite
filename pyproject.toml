[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-vite"
version = "3.0.0"
description = "Native Slint Ubuntu desktop app to manage local Odoo instances (creation wizard + lifecycle + DB/modules/config/logs/devtools)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psutil>=5.9",
    "keyring>=24.0",
    # PSS-9: Slint is the frontend now (was an opt-in extra while Qt
    # coexisted). Pinned exact — the Python API is still beta:
    # type-only callback args and Timer(timedelta) verified against
    # this build; re-verify the three syntax facts on every bump
    # (docs/slint-thread-safety.md). Licensed royalty-free; the app
    # shows the AboutSlint disclosure (sidebar → About Slint).
    "slint==1.18.1b1",
]
authors = [{ name = "Odoo Vite Team" }]

[project.optional-dependencies]
test = ["pytest>=8.0"]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.setuptools.packages.find]
include = ["odoo_vite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Maintenance-ticket scope: pyflakes (unused imports/names, undefined
# names) + syntax errors only. The bug class linters catch instantly;
# style rules stay out until someone wants that fight.
target-version = "py312"
select = ["F", "E9"]
