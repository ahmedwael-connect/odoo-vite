[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-vite"
version = "1.0.1"
description = "Native GTK4 Ubuntu desktop app to manage local Odoo instances (Phase 1: creation wizard + lifecycle)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyGObject>=3.48",
    "psutil>=5.9",
    "keyring>=24.0",
    # PSQ-1.1: pinned exact — Qt has meaningful behavior differences
    # across minor versions; verified 6.9.1 on Ubuntu 24.04 / Python 3.12
    # (both xcb under Xvfb and offscreen platform plugin work, no extra
    # system packages needed; user-space install only).
    "PySide6==6.9.1",
]
authors = [{ name = "Odoo Vite Team" }]

[project.optional-dependencies]
test = ["pytest>=8.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["odoo_vite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
